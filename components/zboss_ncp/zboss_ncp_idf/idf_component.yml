## Same Zigbee libraries upstream builds with (main/idf_component.yml).
## ESPHome's own `zigbee` component uses esp-zigbee-lib 2.x; the two do not mix
## (the components conflict on purpose).
dependencies:
  espressif/esp-zigbee-lib: "~1.6.0"
  espressif/esp-zboss-lib: "~1.6.0"
  idf:
    version: ">=5.3.0"
