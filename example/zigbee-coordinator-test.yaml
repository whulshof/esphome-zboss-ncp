# First hardware test: WiFi only, no WireGuard; only the LAN may open the NCP port.
# Zigbee2MQTT:  serial: { port: "tcp://<tunnel-ip>:6638", adapter: zboss }
# ZHA:          socket://<tunnel-ip>:6638, radio type ZBOSS (zigpy-zboss)

esphome:
  name: zigbee-coordinator-test
  friendly_name: Zigbee coordinator (test)

esp32:
  variant: esp32c6
  board: esp32-c6-devkitc-1
  flash_size: 4MB
  framework:
    type: esp-idf
    sdkconfig_options:
      # test: show the NCP's own ESP-IDF logs (INFO) in ESPHome's log
      CONFIG_LOG_DEFAULT_LEVEL_INFO: y
      CONFIG_LOG_MAXIMUM_LEVEL_INFO: y

external_components:
  - source:
      type: local
      path: ../components
  # From git instead:
  # - source: github://whulshof/esphome-zboss-ncp@main
  #   components: [zboss_ncp]

logger:
  # USB-Serial/JTAG is free for logs: the NCP only talks TCP (and optionally UART1).
  level: INFO

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    encryption:
      key: !secret api_key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # No 'ap:' / captive_portal: an access point cannot share the radio with Zigbee.
  power_save_mode: none   # zboss_ncp forces this anyway

time:
  - platform: sntp
    id: sntp_time

zboss_ncp:
  port: 6638
  allowed_ips:
    - !secret lan_network
  channel:
    name: Zigbee channel
  pan_id:
    name: Zigbee PAN ID
  extended_pan_id:
    name: Zigbee extended PAN ID
  firmware_version:
    name: NCP firmware
  host_connected:
    name: Zigbee host connected
  network_lost:
    name: Zigbee network lost
  safe_mode:
    name: NCP safe mode

sensor:
  - platform: wifi_signal
    name: WiFi signal
    update_interval: 60s
